<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>幹部專區</title><link rel="stylesheet" href="common.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="config.js"></script><script src="lib.js"></script></head>
<body>
<header style="background:#f2b530;color:#12294a"><h1>幹部專區</h1><p id="who">載入中…</p></header>
<main>
  <div class="chips" id="roles"></div>
  <div id="msg" class="msg" hidden></div>
  <div id="sections"></div>
  <div class="card plan" id="planBox" hidden><h2>其他職務功能</h2><div id="plans"></div></div>
  <div class="card" id="pickBox" hidden>
    <h2>依分區查詢報名名單</h2>
    <p style="font-size:13px;color:#7a8294;margin:0 0 10px">點選任一分區。每次查詢都由後端依您的職務即時判斷是否有權限，無權限會被拒絕並留下存取紀錄。</p>
    <div id="pick" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    <div id="pickResult" style="margin-top:12px"></div>
  </div>
</main>
<script>
const pct = (n) => '<div class="bar"><i style="width:' + n + '%"></i></div>';
function districtHtml(s) {
  return '<div class="card"><h2>' + esc(s.district) + '｜' + esc(s.event) + '</h2>' +
    '<div class="num">' + s.registered + ' / ' + s.total + ' <span style="font-size:15px;color:#7a8294">已報名（' + s.rate + '%）</span></div>' + pct(s.rate) +
    '<h2 style="margin-top:14px">報名名單</h2><table><tr><th>會員單位</th><th>代表人</th><th>電話</th><th>Email</th></tr>' +
    s.regList.map((x) => '<tr><td>' + esc(x.unit) + '</td><td>' + esc(x.rep) + '</td><td>' + esc(x.phone) + '</td><td>' + esc(x.email) + '</td></tr>').join('') + '</table>' +
    '<h2 style="margin-top:14px">未報名</h2><table>' + (s.unregList.length ? s.unregList.map((x) => '<tr><td>' + esc(x.unit) + '</td><td>' + esc(x.rep) + '</td></tr>').join('') : '<tr><td>全數已報名</td></tr>') + '</table>' +
    '<p style="font-size:12px;color:#9aa1ae">電話、Email 已由後端遮罩</p></div>';
}
function statsHtml(s) {
  return '<div class="card"><h2>全會報名統計｜' + esc(s.event) + '</h2>' +
    '<div class="num">' + s.registered + ' / ' + s.total + ' <span style="font-size:15px;color:#7a8294">全會報名率 ' + s.rate + '%</span></div>' + pct(s.rate) +
    '<table style="margin-top:12px"><tr><th>分區</th><th>報名</th><th>會員數</th><th style="width:40%">報名率</th></tr>' +
    s.rows.map((r) => '<tr><td>' + esc(r.district) + '</td><td>' + r.registered + '</td><td>' + r.total + '</td><td>' + r.rate + '% ' + pct(r.rate) + '</td></tr>').join('') + '</table></div>';
}
function allHtml(s) {
  return '<div class="card"><h2>全會報名名單｜' + esc(s.event) + '（' + s.list.length + ' 筆）</h2><div style="overflow-x:auto"><table><tr><th>分區</th><th>會員單位</th><th>代表人</th><th>電話</th><th>Email</th></tr>' +
    s.list.map((x) => '<tr><td>' + esc(x.district) + '</td><td>' + esc(x.unit) + '</td><td>' + esc(x.rep) + '</td><td>' + esc(x.phone) + '</td><td>' + esc(x.email) + '</td></tr>').join('') +
    '</table></div><a class="btn" href="' + esc(s.backend) + '">秘書處後台入口</a></div>';
}
async function load() {
  const r = await api('officerView');
  if (!r.ok) { $('who').textContent = ''; say(r.error === 'FORBIDDEN' ? '幹部專區限具職務者使用。' : (ERRTXT[r.error] || r.error), 'err'); return; }
  if (!r.bound) { $('who').textContent = '尚未綁定'; say('此功能限已綁定的幹部使用。' + bindLink()); return; }
  $('who').textContent = r.name + '｜依職務顯示';
  $('roles').innerHTML = r.roles.map((x) => '<span>' + esc(x) + '</span>').join('');
  $('sections').innerHTML = r.sections.map((s) => s.type === 'district' ? districtHtml(s) : s.type === 'stats' ? statsHtml(s) : allHtml(s)).join('');
  if (r.planned.length) { $('planBox').hidden = false; $('plans').innerHTML = r.planned.map((p) => '<a href="' + planned(p.item, p.phase) + '">' + esc(p.item) + '<span>規劃中 ›</span></a>').join(''); }
  $('pickBox').hidden = false;
  $('pick').innerHTML = r.districts.map((d) => '<button class="btn line" style="margin:0;padding:10px 4px;font-size:15px" data-d="' + esc(d) + '">' + esc(d) + '</button>').join('');
  $('pick').querySelectorAll('button').forEach((b) => { b.onclick = () => pick(b.dataset.d, b); });
}
async function pick(d, btn) {
  $('pick').querySelectorAll('button').forEach((b) => { b.disabled = true; b.style.background = ''; b.style.color = ''; });
  btn.style.background = '#12294a'; btn.style.color = '#fff';
  $('pickResult').innerHTML = '<div class="msg">查詢「' + esc(d) + '」中…</div>';
  const r = await api('officerDistrict', { district: d });
  $('pick').querySelectorAll('button').forEach((b) => { b.disabled = false; });
  if (r.ok) $('pickResult').innerHTML = '<div class="msg ok">✅ 有權限：以下為「' + esc(d) + '」的即時資料</div>' + districtHtml(r.section);
  else if (r.error === 'FORBIDDEN') $('pickResult').innerHTML = '<div class="msg err">⛔ 後端拒絕：您的職務沒有查詢「' + esc(d) + '」名單的權限。<br><small>此次嘗試已記錄於存取紀錄。</small></div>';
  else $('pickResult').innerHTML = '<div class="msg err">' + esc(ERRTXT[r.error] || r.error) + '</div>';
}
startLiff(load);
</script></body></html>
